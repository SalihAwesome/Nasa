<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find Earth sites for Moon and Mars equipment tests. Compare conditions, explore sunlight, and check satellite estimates against field measurements." />
    <meta name="theme-color" content="#eef2f5" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('tayf-theme') === 'dark' ? 'dark' : 'light';
      } catch { /* Keep the default theme if storage is unavailable. */ }
    </script>
    <title>Tayf</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
